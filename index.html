<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>اختبار الفيزياء - الصف الثاني الثانوي</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 15px;
    }

    .container {
      width: 100%;
      max-width: 650px;
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 25px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
    }

    h1, h2 {
      text-align: center;
      color: #38bdf8;
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 5px;
      color: #94a3b8;
    }

    input[type="text"] {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #fff;
      font-size: 16px;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: #38bdf8;
    }

    .btn {
      width: 100%;
      padding: 14px;
      background: #0284c7;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
      margin-top: 10px;
    }

    .btn:hover {
      background: #0369a1;
    }

    .instructions {
      background: rgba(15, 23, 42, 0.6);
      padding: 15px;
      border-radius: 10px;
      border-right: 4px solid #38bdf8;
      margin-bottom: 20px;
      font-size: 14px;
      line-height: 1.6;
      color: #cbd5e1;
    }

    .hidden {
      display: none;
    }

    .question-card {
      background: rgba(15, 23, 42, 0.5);
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 15px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .question-title {
      font-weight: bold;
      margin-bottom: 12px;
      color: #f1f5f9;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .option-btn {
      padding: 10px 15px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #e2e8f0;
      text-align: right;
      cursor: pointer;
      transition: 0.2s;
    }

    .option-btn:hover {
      background: #334155;
    }

    .option-btn.selected {
      background: #0284c7;
      border-color: #38bdf8;
      color: #fff;
    }

    .result-item {
      background: rgba(15, 23, 42, 0.6);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 10px;
      border-right: 4px solid #94a3b8;
    }

    .result-item.correct { border-right-color: #22c55e; }
    .result-item.incorrect { border-right-color: #ef4444; }

    .ans-correct { color: #4ade80; font-weight: bold; }
    .ans-wrong { color: #f87171; font-weight: bold; }
  </style>
</head>
<body>

<div class="container">
  <!-- شاشة الدخول والتعليمات -->
  <div id="login-screen">
    <h1>اختبار الفيزياء</h1>
    <div class="instructions">
      <h3>⚠️ تعليمات هامة قبل البدء:</h3>
      <ul>
        <li>يرجى إدخال اسمك ورقم هاتفك بشكل صحيح.</li>
        <li>الخروج من الشاشة أو تبديل التطبيقات محظور أثناء الاختبار.</li>
        <li>أجب عن جميع الأسئلة ثم اضغط على زر تسليم الاختبار.</li>
      </ul>
    </div>
    <div class="form-group">
      <label>اسم الطالب ثلاثي:</label>
      <input type="text" id="student-name" placeholder="أدخل اسمك الكامل">
    </div>
    <div class="form-group">
      <label>رقم الهاتف:</label>
      <input type="text" id="student-phone" placeholder="أدخل رقم هاتفك">
    </div>
    <button class="btn" onclick="startQuiz()">بدء الاختبار</button>
  </div>

  <!-- شاشة الأسئلة -->
  <div id="quiz-screen" class="hidden">
    <h2>الأسئلة</h2>
    <div id="questions-container"></div>
    <button class="btn" onclick="submitQuiz()">تسليم الاختبار</button>
  </div>

  <!-- شاشة النتيجة -->
  <div id="result-screen" class="hidden">
    <h2>نتيجة الاختبار</h2>
    <div id="score-text" style="text-align:center; font-size:20px; margin-bottom:20px;"></div>
    <div id="review-container"></div>
  </div>
</div>

<script>
  // تعطيل كليك يمين والنسخ لحماية الشاشة
  document.addEventListener('contextmenu', e => e.preventDefault());
  document.addEventListener('keydown', e => {
    if (e.ctrlKey && (e.key === 'c' || e.key === 'u' || e.key === 's')) e.preventDefault();
  });

  // بيانتات أسئلة الاختبار
  const questions = [
    { q: "15. يكون اتجاه العزم موجباً (+) عندما يدور الجسم مع اتجاه حركة عقارب الساعة.", options: ["صح", "خطأ"], ans: 1 },
    { q: "16. عزم القوة هو حاصل ضرب القوة في البعد العمودي عن نقطة الارتكاز.", options: ["صح", "خطأ"], ans: 0 },
    { q: "17. وحدة قياس عزم القوة في النظام الدولي (SI) هي:", options: ["N·m", "N/m", "J·s"], ans: 0 },
    { q: "18. طالب وزنه 400N على بعد 1.4m من المحور، يجلس صديقه (600N) وصندوق (100N) على بعد d. احسب المسافة d للاتزان:", options: ["0.8 m", "1.2 m", "0.5 m"], ans: 0 },
    { q: "19. أي من الكميات الفيزيائية التالية تعتبر كمية متجهة يلزم تحديد اتجاهها؟", options: ["عزم القوة والقوة معاً", "الكتلة فقط", "الزمن فقط"], ans: 0 },
    { q: "20. ينعدم عزم القوة تماماً عندما تكون الزاوية بين خط عمل القوة والساق تساوي:", options: ["0° أو 180°", "90°", "45°"], ans: 0 },
    { q: "21. عند زيادة الزاوية θ من 0° إلى 90° بين القوة والساق، فإن مقدار عزم القوة:", options: ["يزداد", "يقل", "ينعدم"], ans: 0 }
  ];

  let userAnswers = {};
  let studentName = "";
  let studentPhone = "";

  function startQuiz() {
    studentName = document.getElementById('student-name').value.trim();
    studentPhone = document.getElementById('student-phone').value.trim();

    if (!studentName || !studentPhone) {
      alert("يرجى إدخال الاسم ورقم الهاتف أولاً!");
      return;
    }

    document.getElementById('login-screen').classList.add('hidden');
    document.getElementById('quiz-screen').classList.remove('hidden');

    const container = document.getElementById('questions-container');
    container.innerHTML = "";

    questions.forEach((q, index) => {
      let qHtml = `
        <div class="question-card">
          <div class="question-title">س${index + 1}: ${q.q}</div>
          <div class="options">
            ${q.options.map((opt, oIndex) => `
              <div class="option-btn" id="opt-${index}-${oIndex}" onclick="selectOption(${index}, ${oIndex})">${opt}</div>
            `).join('')}
          </div>
        </div>
      `;
      container.innerHTML += qHtml;
    });
  }

  function selectOption(qIndex, oIndex) {
    userAnswers[qIndex] = oIndex;
    questions[qIndex].options.forEach((_, idx) => {
      const btn = document.getElementById(`opt-${qIndex}-${idx}`);
      if (btn) btn.classList.remove('selected');
    });
    document.getElementById(`opt-${qIndex}-${oIndex}`).classList.add('selected');
  }

  function submitQuiz() {
    let score = 0;
    questions.forEach((q, i) => {
      if (userAnswers[i] === q.ans) score++;
    });

    document.getElementById('quiz-screen').classList.add('hidden');
    document.getElementById('result-screen').classList.remove('hidden');
    document.getElementById('score-text').innerHTML = `الطالب: <b>${studentName}</b><br>الدرجة: <b>${score} من ${questions.length}</b>`;

    let reviewHtml = "";
    questions.forEach((q, i) => {
      let isCorrect = userAnswers[i] === q.ans;
      let userAnsText = userAnswers[i] !== undefined ? q.options[userAnswers[i]] : "لم يُجب";
      let correctAnsText = q.options[q.ans];

      reviewHtml += `
        <div class="result-item ${isCorrect ? 'correct' : 'incorrect'}">
          <div><b>س${i + 1}:</b> ${q.q}</div>
          <div>إجابتك: <span class="${isCorrect ? 'ans-correct' : 'ans-wrong'}">${userAnsText}</span></div>
          ${!isCorrect ? `<div>الإجابة الصحيحة: <span class="ans-correct">${correctAnsText}</span></div>` : ''}
        </div>
      `;
    });
    document.getElementById('review-container').innerHTML = reviewHtml;

    sendToTelegram(studentName, studentPhone, score, questions.length);
  }

  function sendToTelegram(name, phone, score, total) {
    const token = "8582239458:AAH4pC1d95jF3MscD_Ld9l619S11P43LscM";
    const chatId = "682855799";

    const text = `📊 **نتيجة اختبار جديدة**\n\n👤 **الاسم:** ${name}\n📞 **الهاتف:** ${phone}\n🎯 **الدرجة:** ${score} من ${total}`;

    fetch(`https://api.telegram.org/bot${token}/sendMessage`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        chat_id: chatId,
        text: text,
        parse_mode: "Markdown"
      })
    }).catch(err => console.log("Telegram Error:", err));
  }
</script>
</body>
</html>
